<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101114"><title>Angelok Hub</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#101114;--panel:#191a1f;--panel2:#222329;--line:#303138;--text:#f4f4f5;--muted:#999ba5;--accent:#e7e7eb;--good:#d7f5df;--danger:#ff7777}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#303139 0,transparent 48%),var(--bg);color:var(--text);font:15px Inter,system-ui,Arial;min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit;border:0}.app{max-width:1100px;margin:auto;min-height:100vh;display:grid;grid-template-columns:310px 1fr;background:#121317}.side{border-right:1px solid var(--line);padding:18px;display:flex;flex-direction:column;min-height:100vh}.brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:19px;letter-spacing:.2px}.logo{width:38px;height:38px;border-radius:13px;background:linear-gradient(145deg,#eee,#777);color:#111;display:grid;place-items:center;font-weight:900}.muted{color:var(--muted)}.search{margin:20px 0 12px;width:100%;background:#222329;border:1px solid var(--line);border-radius:13px;padding:13px;color:white;outline:none}.nav{display:flex;gap:7px;margin-bottom:15px}.nav button,.softbtn{background:#222329;border:1px solid var(--line);border-radius:11px;padding:10px 12px}.nav button.active{background:#e8e8eb;color:#141519}.sectionlabel{font-size:11px;color:#858791;letter-spacing:1.5px;margin:12px 4px}.chatlist{display:flex;flex-direction:column;gap:5px}.chatitem{display:flex;gap:11px;align-items:center;text-align:left;padding:11px;background:transparent;border-radius:13px;width:100%}.chatitem:hover,.chatitem.active{background:#25262c}.avatar{width:43px;height:43px;flex:none;border-radius:50%;background:linear-gradient(145deg,#777,#292a30);display:grid;place-items:center;overflow:hidden;font-weight:700;color:#fff}.avatar img{width:100%;height:100%;object-fit:cover}.chatmeta{min-width:0;flex:1}.chatname{font-weight:650;display:flex;gap:5px;align-items:center}.preview{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}.check{color:#d8eaff;font-size:13px}.main{min-width:0;display:flex;flex-direction:column;min-height:100vh}.top{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;gap:12px}.top h2{font-size:16px;margin:0}.top .sub{font-size:12px;color:var(--muted);margin-top:4px}.content{padding:24px;overflow:auto;flex:1}.welcome{height:100%;min-height:65vh;display:grid;place-items:center;text-align:center}.welcomeBox{max-width:400px}.welcomeMark{width:76px;height:76px;border-radius:25px;background:linear-gradient(145deg,#eee,#666);color:#111;display:grid;place-items:center;font-size:27px;font-weight:900;margin:0 auto 20px}.card{background:linear-gradient(145deg,#202127,#191a1f);border:1px solid var(--line);border-radius:18px;padding:19px;margin-bottom:14px}.card h3{margin:0 0 14px}.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.field{width:100%;padding:13px 14px;background:#111216;border:1px solid #363740;border-radius:12px;color:white;outline:none;margin:6px 0 13px}.primary{background:#e8e8eb;color:#15161a;border-radius:12px;padding:13px 17px;font-weight:750}.secondary{background:#292a30;border:1px solid #3b3c44;border-radius:12px;padding:12px 15px}.danger{color:#ff9292}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.label{font-size:12px;color:#b0b1b9}.profilehead{display:flex;gap:15px;align-items:center}.bigavatar{width:76px;height:76px;border-radius:22px}.messages{display:flex;flex-direction:column;gap:10px;max-width:780px;margin:0 auto}.bubble{max-width:78%;padding:11px 14px;border-radius:16px;background:#292a30;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.mine{align-self:flex-end;background:#e8e8eb;color:#17181c;border-bottom-right-radius:5px}.bubble.theirs{align-self:flex-start;border-bottom-left-radius:5px}.time{font-size:10px;opacity:.55;margin-top:5px;text-align:right}.composer{display:flex;gap:9px;padding:15px 20px;border-top:1px solid var(--line)}.composer input{flex:1;background:#222329;border:1px solid var(--line);border-radius:14px;padding:13px;color:white;outline:none}.result{display:flex;gap:12px;align-items:center;padding:13px;border-bottom:1px solid var(--line);cursor:pointer}.result:last-child{border:0}.pill{font-size:11px;border:1px solid #4b4c55;padding:4px 8px;border-radius:20px;color:#c5c6ce}.modalback{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal{width:min(430px,100%);background:#1c1d22;border:1px solid #44454e;border-radius:20px;padding:22px}.toast{position:fixed;bottom:25px;left:50%;transform:translate(-50%,20px);opacity:0;background:#eee;color:#111;padding:12px 17px;border-radius:12px;transition:.25s;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}.hidden{display:none!important}.loading{opacity:.6;pointer-events:none}.spinner{width:16px;height:16px;border:2px solid #777;border-top-color:white;border-radius:50%;display:inline-block;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:720px){.app{display:block}.side{min-height:auto;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:13px}.brand{font-size:17px}.search{margin:12px 0 9px}.nav{margin-bottom:8px}.chatlist{display:none;max-height:180px;overflow:auto}.side.showlist .chatlist{display:flex}.sectionlabel{margin:7px 4px}.main{min-height:calc(100vh - 190px)}.top{height:60px;padding:0 15px}.content{padding:15px}.formgrid{grid-template-columns:1fr}.bubble{max-width:88%}.composer{padding:10px}.welcome{min-height:45vh}}
</style></head>
<body>
<div class="app">
<aside class="side" id="side">
 <div class="brand"><div class="logo">A</div><div>ANGELOK HUB<div class="muted" style="font-size:10px;font-weight:500;letter-spacing:1.4px">MESSENGER</div></div></div>
 <input id="search" class="search" placeholder="Поиск по username или нику..." autocomplete="off">
 <div class="nav"><button id="navChats" class="active" onclick="showChats()">Чаты</button><button id="navSearch" onclick="showSearch()">Поиск</button><button onclick="showProfile()">Профиль</button></div>
 <div class="sectionlabel">ЗАКРЕПЛЕНО</div>
 <button class="chatitem" onclick="openAI()"><div class="avatar">✦</div><div class="chatmeta"><div class="chatname">Angelok AI <span class="pill">AI</span></div><div class="preview">Ваш личный помощник</div></div></button>
 <div class="sectionlabel">СООБЩЕНИЯ <span id="chatCount" class="muted"></span></div>
 <div class="chatlist" id="chatList"></div>
 <div style="margin-top:auto;padding-top:16px" class="muted" id="sideUser">Подключение...</div>
</aside>
<main class="main">
 <header class="top"><div class="avatar" id="headAvatar">A</div><div><h2 id="headTitle">Angelok Hub</h2><div class="sub" id="headSub">Личные сообщения</div></div><div style="margin-left:auto" id="headActions"></div></header>
 <section class="content" id="content"><div class="welcome"><div class="welcomeBox"><div class="welcomeMark">A</div><h2>Добро пожаловать в Angelok Hub</h2><p class="muted">Выбери чат слева или найди нового тиммейта в поиске.</p><button class="primary" onclick="showSearch()">Найти игроков</button></div></div></section>
 <form class="composer hidden" id="composer"><input id="messageInput" maxlength="4000" placeholder="Написать сообщение..."><button class="primary">➤</button></form>
</main></div>
<div class="modalback" id="modal"><div class="modal" id="modalBody"></div></div><div class="toast" id="toast"></div>
<script>
const tg=window.Telegram?.WebApp; tg?.ready(); tg?.expand();
const initData=tg?.initData||""; let me=null, profile=null, currentPeer=null, currentAI=false, lastMsg=0, poller=null, searchTimer=null;
const $=id=>document.getElementById(id);
async function api(path,opts={}){const r=await fetch(path,{...opts,headers:{"Content-Type":"application/json","X-Telegram-Init-Data":initData,...(opts.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.message||d.error||"Ошибка запроса ("+r.status+")");return d}
function toast(t){$("toast").textContent=t;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),2400)}
function avatarHtml(p,cls="avatar"){return `<div class="${cls}">${p?.avatar?`<img src="${p.avatar}">`:(p?.display_name||p?.nickname||"?").slice(0,1).toUpperCase()}</div>`}
function badge(p){return p?.verified?'<span class="check" title="Покупал лимит">✓</span>':''}
function setHead(title,sub="",p=null){$("headTitle").innerHTML=title;$("headSub").textContent=sub;$("headAvatar").innerHTML=p?.avatar?`<img src="${p.avatar}">`:(p?.nickname||"A").slice(0,1).toUpperCase()}
function showContent(html){$("content").innerHTML=html;$("composer").classList.add("hidden");currentPeer=null;currentAI=false;clearInterval(poller)}
function setNav(which){["navChats","navSearch"].forEach(x=>$(x).classList.toggle("active",x===which))}
async function boot(){try{if(!initData)throw Error("Открой Angelok Hub через кнопку в Telegram-боте.");const d=await api("/api/me");me=d.telegram;profile=d.profile;$("sideUser").textContent=(profile?.display_name||me.first_name)+" · Telegram";if(!profile?.nickname){showOnboarding()}else{await refreshChats();showChats()}}catch(e){showContent(`<div class="card"><h3>Не удалось подключиться</h3><p class="muted">${escapeHtml(e.message)}</p><p class="muted">Открой мини-приложение из Telegram-бота и проверь, что HTTP-сервер включён в Bothost.</p></div>`);setHead("Angelok Hub","Требуется подключение")}}
function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function showOnboarding(){setHead("Создание профиля","Один раз — и можно общаться");showContent(`
<div class="card"><h3>Добро пожаловать в Angelok Hub</h3><p class="muted">Создай профиль игрока. Telegram ID и личный аккаунт другим пользователям не показываются.</p>
<label class="label">Аватар</label><div class="row"><div class="avatar bigavatar" id="avatarPreview">A</div><input class="field" style="margin:0" type="file" id="avatarFile" accept="image/*"></div>
<div class="formgrid"><div><label class="label">Игровой ник</label><input class="field" id="nickname" maxlength="24" placeholder="Твой ник"></div><div><label class="label">ID Standoff 2</label><input class="field" id="gameid" inputmode="numeric" placeholder="123456789"></div><div><label class="label">Возраст</label><input class="field" id="age" type="number" min="7" max="99" placeholder="Возраст"></div><div><label class="label">Софт</label><select class="field" id="soft"><option value="0">Без софта</option><option value="1">С софтом</option></select></div></div>
<label class="label">Username для поиска (необязательно)</label><input class="field" id="username" maxlength="20" placeholder="angelok_user">
<label class="label">Описание (необязательно)</label><textarea class="field" id="about" rows="3" maxlength="300" placeholder="Расскажи о себе и стиле игры"></textarea>
<button class="primary" style="width:100%" onclick="saveProfile()">Создать профиль</button></div>`);$("avatarFile").onchange=readAvatar}
let avatarData="";
function readAvatar(e){const f=e.target.files[0];if(!f)return;if(f.size>900000){toast("Выбери фото до 900 КБ");return}const rd=new FileReader();rd.onload=()=>{avatarData=rd.result;$("avatarPreview").innerHTML=`<img src="${avatarData}">`};rd.readAsDataURL(f)}
async function saveProfile(){try{const d=await api("/api/profile",{method:"POST",body:JSON.stringify({nickname:$("nickname").value,standoff_id:$("gameid").value,age:$("age").value,soft:$("soft").value,username:$("username").value,about:$("about").value,avatar:avatarData,display_name:$("nickname").value})});profile=d.profile;toast("Профиль создан");await refreshChats();showChats()}catch(e){toast(e.message)}}
async function refreshChats(){const d=await api("/api/chats");$("chatCount").textContent=`${d.used}/${d.limit}`;$("chatList").innerHTML=d.chats.map(c=>`<button class="chatitem" onclick="openChat(${c.peer.user_id})">${avatarHtml(c.peer)}<div class="chatmeta"><div class="chatname">${escapeHtml(c.peer.nickname)} ${badge(c.peer)}</div><div class="preview">${escapeHtml(c.last_message)}</div></div></button>`).join("")||'<div class="muted" style="padding:12px;font-size:13px">Пока нет диалогов</div>'}
async function showChats(){setNav("navChats");$("side").classList.add("showlist");try{await refreshChats()}catch(e){}setHead("Чаты","Личные сообщения");showContent(`<div class="welcome"><div class="welcomeBox"><div class="welcomeMark">A</div><h2>Твои переписки</h2><p class="muted">Выбери существующий чат или найди нового тиммейта. Чат с Angelok AI всегда закреплён сверху.</p><button class="primary" onclick="showSearch()">Найти игроков</button></div></div>`)}
function showSearch(){setNav("navSearch");$("side").classList.add("showlist");setHead("Поиск игроков","Найди напарника по нику или username");showContent(`<div class="card"><div class="row between"><h3>Игроки Angelok Hub</h3><button class="secondary" onclick="loadUsers('')">Показать всех</button></div><p class="muted">Нажми на игрока, чтобы открыть профиль и начать переписку.</p><div id="results"><span class="muted">Введи запрос или нажми «Показать всех».</span></div></div>`)}
async function loadUsers(q){try{const d=await api("/api/users?q="+encodeURIComponent(q));$("results").innerHTML=d.users.map(p=>`<div class="result" onclick="showUser(${p.user_id})">${avatarHtml(p)}<div style="flex:1;min-width:0"><div class="chatname">${escapeHtml(p.nickname)} ${badge(p)}</div><div class="preview">${p.username?"@"+escapeHtml(p.username)+" · ":""}ID: ${escapeHtml(p.standoff_id)} · ${p.age} лет</div></div><span class="pill">Открыть</span></div>`).join("")||'<p class="muted">Игроки не найдены.</p>'}catch(e){toast(e.message)}}
$("search").addEventListener("input",e=>{clearTimeout(searchTimer);const q=e.target.value.trim();if($("results")){searchTimer=setTimeout(()=>loadUsers(q),250)}else{showSearch();setTimeout(()=>loadUsers(q),30)}})
async function showUser(uid){try{const d=await api("/api/users?q=");const p=d.users.find(x=>x.user_id===uid);if(!p){toast("Игрок не найден");return}setHead(escapeHtml(p.nickname)+" "+badge(p),"Профиль игрока",p);showContent(`<div class="card"><div class="profilehead">${avatarHtml(p,"avatar bigavatar")}<div><h2 style="margin:0">${escapeHtml(p.nickname)} ${badge(p)}</h2><div class="muted">${p.username?"@"+escapeHtml(p.username):"Username скрыт"}</div></div></div><div class="formgrid" style="margin-top:20px"><div><span class="label">Игровой ID</span><p>${escapeHtml(p.standoff_id)}</p></div><div><span class="label">Возраст</span><p>${p.age}</p></div><div><span class="label">Софт</span><p>${p.soft?"С софтом":"Без софта"}</p></div></div><p>${escapeHtml(p.about||"Без описания")}</p><button class="primary" onclick="openChat(${uid})">Написать сообщение</button></div>`)}catch(e){toast(e.message)}}
async function openChat(uid){try{const d=await api(`/api/chats/${uid}/open`,{method:"POST",body:"{}"});currentPeer=uid;currentAI=false;lastMsg=0;setHead(escapeHtml(d.peer.nickname)+" "+badge(d.peer),"В сети · Angelok Hub",d.peer);$("composer").classList.remove("hidden");$("content").innerHTML='<div class="messages" id="messages"></div>';await pollMessages();clearInterval(poller);poller=setInterval(pollMessages,2500);await refreshChats()}catch(e){if(e.message.includes("лимит")||e.message.includes("Payment Required")){openSubscriptions()}else toast(e.message)}}
async function pollMessages(){if(!currentPeer)return;try{const d=await api(`/api/chats/${currentPeer}/messages?after=${lastMsg}`);for(const m of d.messages){lastMsg=Math.max(lastMsg,m.id);const div=document.createElement("div");div.className="bubble "+(m.sender_id===me.id?"mine":"theirs");div.innerHTML=escapeHtml(m.body)+`<div class="time">${new Date(m.created_at.replace(" ","T")+"Z").toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}</div>`;$("messages").appendChild(div)}if(d.messages.length)$("content").scrollTop=$("content").scrollHeight}catch(e){}}
$("composer").addEventListener("submit",async e=>{e.preventDefault();const body=$("messageInput").value.trim();if(!body)return;try{if(currentAI){const d=await api("/api/ai",{method:"POST",body:JSON.stringify({message:body})});appendBubble(body,true);appendBubble(d.answer,false)}else{await api(`/api/chats/${currentPeer}/messages`,{method:"POST",body:JSON.stringify({body})});$("messageInput").value="";await pollMessages()}}catch(e){toast(e.message)}})
function appendBubble(body,mine){const div=document.createElement("div");div.className="bubble "+(mine?"mine":"theirs");div.textContent=body;$("messages").appendChild(div);$("content").scrollTop=$("content").scrollHeight}
function openAI(){currentAI=true;currentPeer=null;lastMsg=0;clearInterval(poller);setHead("Angelok AI","Всегда закреплён · не расходует лимит");showContent('<div class="messages" id="messages"><div class="bubble theirs">Привет! Я помощник Angelok Hub. Чем могу помочь?</div></div>');$("composer").classList.remove("hidden")}
async function showProfile(){setHead("Профиль","Настройки аккаунта");showContent(`<div class="card"><div class="profilehead">${avatarHtml(profile,"avatar bigavatar")}<div><h2 style="margin:0">${escapeHtml(profile?.nickname||"Игрок")} ${badge(profile)}</h2><div class="muted">@${escapeHtml(profile?.username||"не задан")}</div></div></div><div class="formgrid" style="margin-top:20px"><div><span class="label">Игровой ID</span><p>${escapeHtml(profile?.standoff_id)}</p></div><div><span class="label">Возраст</span><p>${profile?.age}</p></div></div><button class="secondary" onclick="editProfile()">Изменить профиль</button></div>
<div class="card"><h3>Подписки и лимиты</h3><div class="row between"><span>Использовано чатов</span><b id="limits">${profile?.chat_limit||2} максимум</b></div><p class="muted">ИИ-чат не учитывается. После покупки рядом с ником появится подтверждённая галочка.</p><button class="primary" onclick="openSubscriptions()">Управление лимитами</button></div>
<div class="card"><h3>Конфиденциальность</h3><p class="muted">Управляй отображением username в поиске.</p><select class="field" id="privacy"><option value="all">Показывать username</option><option value="hidden">Скрыть username</option></select><button class="secondary" onclick="savePrivacy()">Сохранить</button></div>`);api("/api/me").then(d=>{profile=d.profile;$("privacy").value=profile.privacy||"all";$("limits").textContent=profile.chat_limit+" чатов"}).catch(()=>{})}
async function savePrivacy(){try{await api("/api/privacy",{method:"POST",body:JSON.stringify({privacy:$("privacy").value})});toast("Настройки сохранены")}catch(e){toast(e.message)}}
function editProfile(){showOnboarding();$("nickname").value=profile.nickname||"";$("gameid").value=profile.standoff_id||"";$("age").value=profile.age||"";$("soft").value=profile.soft?"1":"0";$("username").value=profile.username||"";$("about").value=profile.about||"";avatarData=profile.avatar||""}
function openSubscriptions(){$("modal").style.display="flex";$("modalBody").innerHTML=`<h3>Дополнительные чаты</h3><p class="muted">Оплата проходит официально через Telegram Stars. Лимит увеличится только после подтверждения платежа Telegram.</p><div class="card"><div class="row between"><b>+5 чатов</b><b>5 ⭐</b></div><button class="primary" style="width:100%;margin-top:12px" onclick="buyPack('5')">Купить за 5 ⭐</button></div><div class="card"><div class="row between"><b>+10 чатов</b><b>10 ⭐</b></div><button class="primary" style="width:100%;margin-top:12px" onclick="buyPack('10')">Купить за 10 ⭐</button></div><button class="secondary" style="width:100%" onclick="$('modal').style.display='none'">Закрыть</button>`}
async function buyPack(pack){try{const d=await api("/api/purchase",{method:"POST",body:JSON.stringify({pack})});toast("Открываем оплату...");tg.openInvoice(d.invoice_url,async status=>{if(status==="paid"){toast("Оплата получена!");await checkPurchase(d.purchase_id)}else if(status==="failed")toast("Платёж не прошёл");else toast("Оплата отменена")})}catch(e){toast(e.message)}}
async function checkPurchase(id){for(let i=0;i<12;i++){const d=await api("/api/purchase/"+id);if(d.status==="paid"){profile=d.profile;$("modal").style.display="none";toast("Лимит увеличен. Галочка активирована.");await refreshChats();showProfile();return}await new Promise(r=>setTimeout(r,1500))}toast("Платёж проверяется. Обнови профиль чуть позже.")}
$("modal").addEventListener("click",e=>{if(e.target===$("modal"))$("modal").style.display="none"});
boot();
</script></body></html>
